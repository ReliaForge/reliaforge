<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReliaForge | One console for your servers, clusters, and Python tools</title>
    <meta
      name="description"
      content="Watch Proxmox, Kubernetes, Argo CD, and alerts in one place. Drop in your own Python ops tools and get auth, UI, and audit for free."
    />
    <meta name="theme-color" content="#090b0f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ReliaForge" />
    <meta
      property="og:description"
      content="One console for your servers, clusters, and custom Python ops scripts."
    />
    <meta property="og:image" content="https://reliaforge.dev/og-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(() => {
        try {
          const params = new URLSearchParams(window.location.search)
          const q = params.get("theme")
          const stored = window.localStorage.getItem("rf.web.theme")
          const prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
          const theme =
            q === "light" || q === "dark"
              ? q
              : stored === "light" || stored === "dark"
                ? stored
                : prefersDark
                  ? "dark"
                  : "light"
          document.documentElement.classList.toggle("dark", theme === "dark")
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute("content", theme === "dark" ? "#090b0f" : "#f6f8fb")
        } catch {
          document.documentElement.classList.add("dark")
        }
      })()
    </script>
  </head>
  <body class="bg-obsidian text-ink antialiased selection:bg-signal/25 selection:text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
